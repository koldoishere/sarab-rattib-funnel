  :root {

  .wordmark {

  .btn {

    width: 100%;
    background: var(--oasis);
    color: var(--night);
    text-decoration: none;
    font-weight: 700;
    padding: 1rem 1.25rem;
    border-radius: 12px;
    font-size: 1.05rem;
    transition: transform .15s, box-shadow .15s;
  }
  .btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 28px rgba(32, 224, 112, .3);

  .price {

    font-size: 0.88rem;
    color: var(--muted);

  footer {
